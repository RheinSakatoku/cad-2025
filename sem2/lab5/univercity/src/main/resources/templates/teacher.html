<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Преподаватель</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #2196F3; color: white; }
    </style>
</head>
<body>
    <h1>Расписание преподавателя <span th:text="${teacherName}"></span></h1>
    
    <table>
        <tr>
            <th>Дата</th>
            <th>Время</th>
            <th>Предмет</th>
            <th>Группа</th>
            <th>Аудитория</th>
            <th>Действия</th>
        </tr>
        <tr th:each="schedule : ${schedules}">
            <td th:text="${#temporals.format(schedule.date, 'dd.MM.yyyy')}"></td>
            <td th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}"></td>
            <td th:text="${schedule.subject}"></td>
            <td th:text="${schedule.groupName}"></td>
            <td th:text="${schedule.room}"></td>
            <td>
                <a th:href="@{/teacher/request/{id}(id=${schedule.id})}">Запросить перенос</a>
            </td>
        </tr>
    </table>
    
    <form action="/logout" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Выйти</button>
    </form>
</body>
</html>
